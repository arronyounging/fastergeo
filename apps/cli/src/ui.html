<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FasterGEO 看板</title>
<style>
/* ── FasterGEO 设计语言：精密仪器 ─────────────────────────────
   深墨底 · 单强调色 · 等宽数字 · 8px 网格 · 克制的色彩语义     */
:root{
  --bg:#0B0E14; --surface:#121826; --surface-2:#0D1420;
  --line:rgba(148,163,184,.10); --line-strong:rgba(148,163,184,.18);
  --tx:#E8EDF5; --dim:#8A96A8; --faint:#5B6675;
  --acc:#8B7CF6; --acc-soft:rgba(139,124,246,.12);
  --red:#F4536E; --red-soft:rgba(244,83,110,.10);
  --green:#2FD08C; --green-soft:rgba(47,208,140,.10);
  --amber:#F0B24A; --amber-soft:rgba(240,178,74,.10);
  --r:14px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);
  font:14px/1.65 -apple-system,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px}

/* Header */
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:20px;
  padding:0 28px;height:60px;background:rgba(11,14,20,.85);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line)}
.logo{font-size:16px;font-weight:700;letter-spacing:-.02em}
.logo b{color:var(--acc);font-weight:800}
.project-chip{display:flex;align-items:center;gap:8px;padding:5px 12px;
  background:var(--surface);border:1px solid var(--line);border-radius:999px;
  font-size:12px;color:var(--dim)}
.project-chip .dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
nav{display:flex;gap:2px;margin-left:auto;background:var(--surface);
  border:1px solid var(--line);border-radius:999px;padding:3px}
nav button{background:none;border:none;color:var(--dim);font-size:13px;font-weight:500;
  padding:7px 18px;border-radius:999px;cursor:pointer;transition:all .15s}
nav button:hover{color:var(--tx)}
nav button.active{background:var(--acc);color:#fff}

main{max-width:1120px;margin:0 auto;padding:28px}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:24px 28px;margin-bottom:20px}
.card-label{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--faint);margin-bottom:16px}

iframe{width:100%;height:calc(100vh - 120px);border:1px solid var(--line);
  border-radius:var(--r);background:var(--bg)}

/* Ticket rows */
.trow{display:flex;align-items:flex-start;gap:16px;padding:16px 4px;
  border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:none}
.trow:hover{background:var(--surface-2);border-radius:8px}
.pill{display:inline-flex;align-items:center;font-size:11px;font-weight:700;
  padding:3px 10px;border-radius:999px;letter-spacing:.02em;white-space:nowrap}
.pill.P0{background:var(--red-soft);color:var(--red)}
.pill.P1{background:var(--amber-soft);color:var(--amber)}
.pill.P2{background:var(--surface-2);color:var(--dim)}
.pill.done{background:var(--green-soft);color:var(--green)}
.pill.todo{background:var(--surface-2);color:var(--dim)}
.pill.regressed{background:var(--red-soft);color:var(--red)}
.pill.pending-manual{background:var(--amber-soft);color:var(--amber)}
.t-main{flex:1;min-width:0}
.t-title{font-weight:600;font-size:14px}
.t-title .tid{color:var(--faint);font-weight:400;margin-right:8px}
.t-rationale{color:var(--dim);font-size:12.5px;margin-top:3px}
.t-acc{margin-top:8px;display:inline-flex;align-items:center;gap:6px;
  font-size:11.5px;color:var(--faint);background:var(--surface-2);
  padding:3px 10px;border-radius:6px}
.t-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0}
select{background:var(--surface-2);color:var(--dim);border:1px solid var(--line);
  border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer}
select:hover{border-color:var(--line-strong);color:var(--tx)}
.verify-note{font-size:11px;color:var(--faint)}

/* Trends */
.alert{display:flex;gap:12px;align-items:flex-start;padding:14px 18px;
  border-radius:12px;margin-bottom:10px;font-size:13.5px}
.alert.P0{background:var(--red-soft);border:1px solid rgba(244,83,110,.25)}
.alert.warn{background:var(--amber-soft);border:1px solid rgba(240,178,74,.2)}
.period-strip{display:flex;align-items:center;gap:10px;color:var(--dim);
  font-size:12.5px;margin-bottom:20px}
.period-strip .p{padding:4px 12px;background:var(--surface-2);border-radius:999px}
.period-strip .p.latest{background:var(--acc-soft);color:var(--acc);font-weight:600}
.drow{display:grid;grid-template-columns:minmax(200px,1.2fr) 90px 30px 90px 1fr;
  align-items:center;gap:8px;padding:12px 4px;border-bottom:1px solid var(--line)}
.drow:last-child{border-bottom:none}
.d-key{color:var(--dim)}
.d-val{font-size:15px;font-weight:600;text-align:right}
.d-arrow{text-align:center;color:var(--faint)}
.d-arrow.up{color:var(--green)}.d-arrow.down{color:var(--red)}
.d-verdict{font-size:12px;color:var(--faint)}
.d-verdict.trend{color:var(--acc);font-weight:600}
.empty{color:var(--dim);text-align:center;padding:64px 20px;font-size:14px}
.empty .hint{color:var(--faint);font-size:12.5px;margin-top:8px}
.na{color:var(--faint)}
code{background:var(--surface-2);padding:1px 6px;border-radius:5px;font-size:12px}
.footnote{color:var(--faint);font-size:12px;margin-top:16px;padding-top:14px;
  border-top:1px solid var(--line)}
</style>
</head>
<body>
<header>
  <div class="logo">Faster<b>GEO</b></div>
  <div class="project-chip"><span class="dot"></span><span id="brandName">加载中…</span></div>
  <nav>
    <button data-tab="overview" class="active">总览</button>
    <button data-tab="tickets">工单</button>
    <button data-tab="trends">趋势</button>
  </nav>
</header>
<main>
  <div id="tab-overview"><iframe src="/api/report"></iframe></div>
  <div id="tab-tickets" style="display:none"></div>
  <div id="tab-trends" style="display:none"></div>
</main>
<script>
const $ = s => document.querySelector(s);
let project = null;

document.querySelectorAll('nav button').forEach(btn => btn.onclick = () => {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b === btn));
  for (const tab of ['overview', 'tickets', 'trends']) {
    $('#tab-' + tab).style.display = tab === btn.dataset.tab ? '' : 'none';
  }
  if (btn.dataset.tab === 'tickets') renderTickets();
  if (btn.dataset.tab === 'trends') renderTrends();
});

async function load() {
  project = await (await fetch('/api/project')).json();
  const n = project.periods.length;
  $('#brandName').textContent = (project.brand.name ?? '未命名') + (n ? ` · ${n} 期数据 · 最新 ${project.periods[n-1]}` : ' · 暂无数据');
}

async function setStatus(id, status) {
  if (!status) return;
  await fetch('/api/ticket', { method: 'POST', body: JSON.stringify({ id, status }) });
  project.tickets.find(t => t.id === id).status = status;
  renderTickets();
}

function renderTickets() {
  const el = $('#tab-tickets');
  const ts = project.tickets;
  if (!ts.length) {
    el.innerHTML = '<div class="card"><div class="empty">暂无工单<div class="hint">跑一期 <code>fastergeo cycle</code> 自动生成</div></div></div>';
    return;
  }
  const auto = ts.filter(t => t.acceptance.type === 'auto').length;
  el.innerHTML = `<div class="card">
    <div class="card-label">行动工单 · ${ts.length} 条 · ${auto} 条机器自动验收</div>
    ${ts.map(t => `
      <div class="trow">
        <span class="pill ${t.priority}">${t.priority}</span>
        <div class="t-main">
          <div class="t-title"><span class="tid mono">${t.id}</span>${esc(t.title)}</div>
          <div class="t-rationale">${esc(t.rationale.slice(0, 110))}</div>
          <div class="t-acc">${t.acceptance.type === 'auto'
            ? `⚙ <span class="mono">${esc(t.acceptance.check)}</span>`
            : '👤 人工验收'} · ${esc(t.acceptance.desc.slice(0, 46))}</div>
        </div>
        <div class="t-side">
          <span class="pill ${t.status}">${t.status}</span>
          ${t.acceptance.type === 'manual'
            ? `<select onchange="setStatus('${t.id}', this.value)">
                <option value="">标记…</option>
                <option value="done">done</option>
                <option value="pending-manual">pending</option>
              </select>`
            : '<span class="verify-note">verify 判定</span>'}
        </div>
      </div>`).join('')}
    <div class="footnote">自动验收工单由 <code>fastergeo verify</code> / <code>cycle</code> 重抓判定，看板不可手改——机器验收的状态不接受口头确认。</div>
  </div>`;
}

async function renderTrends() {
  const el = $('#tab-trends');
  const t = await (await fetch('/api/trends')).json();
  if (t.periods.length < 2) {
    el.innerHTML = `<div class="card"><div class="empty">${t.periods.length} 期数据，至少两期才能对比
      <div class="hint">口径：单期变化只作观察，连续两期同向才算趋势</div></div></div>`;
    return;
  }
  const pct = v => v === null ? '<span class="na">未测</span>' : (v <= 1 ? (v * 100).toFixed(0) + '%' : v);
  el.innerHTML = `
    ${t.alerts.map(a => `<div class="alert ${a.level}"><span>${a.level === 'P0' ? '🔴' : '⚠️'}</span><span>${esc(a.message)}</span></div>`).join('')}
    <div class="card">
      <div class="card-label">期间对比</div>
      <div class="period-strip">${t.periods.map((p, i) =>
        `<span class="p num ${i === t.periods.length - 1 ? 'latest' : ''}">${p}</span>${i < t.periods.length - 1 ? '→' : ''}`).join('')}</div>
      ${t.deltas.map(d => `<div class="drow">
        <span class="d-key mono">${esc(d.key)}</span>
        <span class="d-val num">${pct(d.prev)}</span>
        <span class="d-arrow ${d.direction}">${d.direction === 'up' ? '↑' : d.direction === 'down' ? '↓' : '→'}</span>
        <span class="d-val num">${pct(d.curr)}</span>
        <span class="d-verdict ${d.verdict.kind}">${
          d.verdict.kind === 'trend' ? '📈 趋势 · 连续' + (d.verdict.direction === 'up' ? '上升' : '下降')
          : d.verdict.kind === 'observation' ? '观察 · 单期波动不定性' : '数据不足'}</span>
      </div>`).join('')}
    </div>`;
}

function esc(s) { return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
load();
</script>
</body>
</html>
