<!doctype html><html><head><meta charset="utf-8">
<title>FasterGEO</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Paper, serif, mono — the same design language as the report and the site.
     The dashboard used to be dark and was the odd one out of three surfaces. -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,700&family=IBM+Plex+Mono:wght@400;500&display=swap');
:root{--paper:#F3F1EA;--card:#FFF;--well:#F8F6F0;--line:#E4E0D4;--rule:#D8D3C4;
--tx:#1C1A15;--dim:#5C574D;--faint:#98917F;--red:#B23A26;--red-soft:#F8ECE8;
--ok:#20714A;--ok-soft:#EAF1EB;--amber:#8A6100;--amber-soft:#F5EFDE}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--tx);
font:13.5px/1.6 -apple-system,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1560px;margin:0 auto;padding:16px}
.mono{font-family:ui-monospace,"IBM Plex Mono",Menlo,monospace}
.beat{display:flex;align-items:center;gap:14px;background:#1C1A15;color:#E8E4D8;
border-radius:10px 10px 0 0;padding:11px 18px;font-size:12.5px;flex-wrap:wrap}
.dot{width:7px;height:7px;border-radius:50%;background:#4ADE80;box-shadow:0 0 8px #4ADE80;flex:none}
.beat .sp{flex:1}
.btn{background:#F3F1EA;color:#1C1A15;border:none;border-radius:6px;padding:6px 13px;
font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.btn.ghost{background:transparent;color:#B9B3A3;border:1px solid #4A453B}
.btn:hover{opacity:.85}
.panes{display:grid;grid-template-columns:236px minmax(0,1fr) 320px 258px;gap:1px;background:var(--line);
border:1px solid var(--line);border-top:none;border-radius:0 0 10px 10px}
@media(max-width:1180px){.panes{grid-template-columns:1fr}}
.pane{background:var(--card);padding:16px 15px;min-width:0}
.ph{font:500 10.5px/1 ui-monospace,"IBM Plex Mono",Menlo,monospace;letter-spacing:.14em;
text-transform:uppercase;color:var(--dim);display:flex;justify-content:space-between;
align-items:center;gap:8px;padding-bottom:9px;border-bottom:1px solid var(--line);margin-bottom:13px}
.ph b{color:var(--tx);font-weight:600}
.brandname{font:700 19px "Newsreader",Georgia,"Songti SC",serif;margin-bottom:2px}
.sub{color:var(--faint);font-size:11.5px;margin-bottom:14px;word-break:break-all}
.doc{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:7px 0;
border-bottom:1px dotted var(--rule);font-size:12.5px;cursor:pointer}
.doc:last-child{border-bottom:none}
.doc:hover{color:var(--red)}
.doc .e{color:var(--faint);font-size:11px;flex:none}
.tag{display:inline-block;font-size:9.5px;padding:1px 6px;border-radius:3px;
background:var(--ok-soft);color:var(--ok);margin-left:5px;font-weight:600;white-space:nowrap}
.tag.warn{background:var(--amber-soft);color:var(--amber)}
.tag.off{background:var(--well);color:var(--faint)}
.sect{font:500 10px ui-monospace,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;
color:var(--faint);margin:18px 0 7px}
.chip{display:inline-block;font-size:11.5px;background:var(--well);border:1px solid var(--line);
border-radius:20px;padding:2px 10px;margin:0 4px 5px 0}
.rules{margin-top:20px;padding:11px 12px;background:var(--well);border-radius:7px;
font-size:11px;line-height:1.75;color:var(--dim)}
.rules b{color:var(--tx)}
.tabs{display:flex;gap:3px;margin-bottom:15px;flex-wrap:wrap}
.tab{font-size:11.5px;padding:5px 11px;border-radius:6px;color:var(--dim);cursor:pointer;
border:1px solid transparent;user-select:none}
.tab:hover{background:var(--well)}
.tab.on{background:#1C1A15;color:#F3F1EA;font-weight:600}
.tab.soon{color:#BEB8A8}
.quote{background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 8px 8px 0;
padding:16px 18px;margin-bottom:11px}
.quote.calm{background:var(--well);border-left-color:var(--rule)}
.quote .q{font:italic 500 16px/1.55 "Newsreader",Georgia,"Songti SC",serif}
.quote.calm .q{font-style:normal;font-size:14px}
.qmeta{margin-top:9px;font:500 10.5px ui-monospace,Menlo,monospace;color:var(--dim);letter-spacing:.04em}
.qtag{display:inline-block;padding:1px 7px;border-radius:3px;background:var(--red);color:#fff;
margin-right:7px;font-size:9px;letter-spacing:.06em}
.qtag.warn{background:var(--amber)}
.meter{margin-top:12px;padding:12px 14px;border:1px dashed var(--rule);border-radius:8px;
display:flex;align-items:center;gap:12px;background:#FCFBF7;flex-wrap:wrap}
.meter .n{font:500 21px ui-monospace,Menlo,monospace}
.meter .t{flex:1;min-width:200px;font-size:12px;color:var(--dim)}
.meter .t b{color:var(--tx)}
.funnel{display:flex;margin:20px 0 6px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.st{flex:1;padding:11px 6px;text-align:center;border-right:1px solid var(--line);font-size:11px}
.st:last-child{border-right:none}
.st .v{font:500 15px ui-monospace,Menlo,monospace;display:block;margin-bottom:3px}
.st.bad{background:var(--red-soft)} .st.bad .v{color:var(--red)}
.st.good{background:var(--ok-soft)} .st.good .v{color:var(--ok)}
.st.na{background:var(--well)} .st.na .v{color:var(--faint)}
.cap{font-size:10.5px;color:var(--faint);margin-bottom:18px;line-height:1.7}
.cap b{color:var(--dim)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;font:500 10px ui-monospace,Menlo,monospace;letter-spacing:.1em;
text-transform:uppercase;color:var(--faint);padding:6px 8px;border-bottom:1px solid var(--rule)}
td{padding:6px 8px;border-bottom:1px solid var(--line)}
td.num{font-family:ui-monospace,Menlo,monospace;text-align:right}
tr.off td{color:#BEB8A8}
.nokey{font-size:10px;color:var(--faint);border:1px solid var(--line);border-radius:3px;padding:0 5px;white-space:nowrap}
.card{border:1px solid var(--line);border-radius:8px;padding:12px 13px;margin-bottom:9px;background:var(--well)}
.card .k{display:flex;gap:7px;align-items:center;margin-bottom:6px}
.pr{font:600 9.5px ui-monospace,Menlo,monospace;padding:1px 6px;border-radius:3px}
.pr.P0{background:var(--red);color:#fff}
.pr.P1{background:var(--amber-soft);color:var(--amber)}
.pr.P2{background:var(--well);color:var(--dim);border:1px solid var(--line)}
.card .t{font-weight:600;font-size:13px;margin-bottom:4px}
.card .w{font-size:11.5px;color:var(--dim);margin-bottom:8px}
.card .acc{font-size:11px;color:var(--dim);padding-top:7px;border-top:1px dotted var(--rule)}
.card .acc b{color:var(--ok)}
.state{display:flex;gap:8px;margin:13px 0;font-size:11.5px}
.state span{flex:1;text-align:center;padding:7px 4px;border-radius:6px;background:var(--well)}
.state .g{color:var(--ok)} .state .r{color:var(--amber)}
.soonbox{border:1px dashed var(--rule);border-radius:8px;padding:18px 20px;background:#FCFBF7}
.soonbox h3{font:600 15px "Newsreader",Georgia,"Songti SC",serif;margin:0 0 6px}
.soonbox p{margin:0 0 12px;font-size:12.5px;color:var(--dim);line-height:1.7}
.soonbox .caps{font-size:11.5px;color:var(--dim);line-height:1.8}
.soonbox .caps b{color:var(--tx)}
.ask{background:var(--well);border:1px dashed var(--rule);border-radius:8px;padding:14px;
font-size:11.5px;color:var(--dim);text-align:center;margin-top:22px}
.ask b{display:block;color:var(--tx);font-size:12.5px;margin-bottom:5px}
.brief{font-size:12px;line-height:1.75;padding-left:16px;margin:0}
.brief li{margin-bottom:9px}
.note{font-size:10.5px;color:var(--faint)}
.empty{color:var(--faint);font-size:12.5px;padding:22px 0;text-align:center}
dialog{border:1px solid var(--line);border-radius:10px;padding:0;max-width:860px;width:92vw;
background:var(--card);color:var(--tx)}
dialog::backdrop{background:rgba(28,26,21,.4)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 18px;
border-bottom:1px solid var(--line);font:600 13px ui-monospace,Menlo,monospace}
.dlg-b{padding:16px 20px;max-height:70vh;overflow:auto;white-space:pre-wrap;
font:12px/1.75 ui-monospace,"IBM Plex Mono",Menlo,monospace}
a{color:var(--red)}
</style></head><body>
<div class="wrap">
  <div class="beat">
    <span class="dot"></span>
    <span><b id="bName">…</b></span>
    <span style="color:#B9B3A3" id="bMeta"></span>
    <span class="sp"></span>
    <span class="mono" style="color:#B9B3A3;font-size:11px" id="bKeys"></span>
    <button class="btn ghost" id="bReport"></button>
    <button class="btn" id="bHire"></button>
  </div>
  <div class="panes">
    <div class="pane" id="pProfile"></div>
    <div class="pane" id="pEvidence"></div>
    <div class="pane" id="pToday"></div>
    <div class="pane" id="pAsk"></div>
  </div>
</div>
<dialog id="dlg"><div class="dlg-h"><span id="dlgT"></span><button class="btn" id="dlgX"></button></div><div class="dlg-b" id="dlgB"></div></dialog>
<script>
const ZH = (navigator.language || '').toLowerCase().startsWith('zh');
const T = (zh, en) => ZH ? zh : en;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pct = v => (v === null || v === undefined) ? null : Math.round(v * 100) + '%';
/** Unmeasured renders as a dash. A zero is a measurement; a dash is its absence. */
const NA = '<span style="color:var(--faint)">—</span>';

/**
 * All seven domains are listed even when unwired. The tab strip is the
 * capability statement — a buyer's main fear is "this thing only looks at SEO" —
 * and an unwired tab that says what it will cover and what backs it reads as a
 * roadmap rather than a dead link.
 */
const DOMAINS = [
  { id: 'demand', zh: '需求', en: 'Demand',
    d: T('谁在找你、用什么词找。', 'Who is looking, and in whose words.'),
    caps: 'keyword-research · serp-analysis · content-gap-analysis · expand' },
  { id: 'visible', zh: '可见', en: 'Visible', live: true },
  { id: 'content', zh: '内容', en: 'Content',
    d: T('写什么、写得够不够好、值不值得被引用。', 'What to write, whether it is good enough, whether it is quotable.'),
    caps: 'content-quality-auditor（CORE-EEAT 80） · geo-content-optimizer · content-refresher' },
  { id: 'convert', zh: '转化', en: 'Convert',
    d: T('人来了留不留得下。流量涨而注册不动，问题在这一栏，不在可见性。', 'Whether arrivals turn into anything. Traffic up but signups flat is a problem here, not in visibility.'),
    caps: 'page-cro · signup-flow-cro · pricing-strategy · design-review' },
  { id: 'author', zh: '权威', en: 'Authority',
    d: T('别人怎么看你，以及 AI 在你的品类里信任谁。', 'Who vouches for you, and who AI trusts in your category.'),
    caps: 'domain-authority-auditor（CITE 40） · backlink-analyzer · ' + T('引用源靶单', 'citation-source targets') },
  { id: 'dist', zh: '分发', en: 'Distribute',
    d: T('写完发到哪里去。', 'Where the work goes once it is written.'),
    caps: 'publish · medium/linkedin/substack · wechat-format · email-sequence' },
  { id: 'watch', zh: '监测', en: 'Watch', live: true },
  { id: 'social', zh: '社交', en: 'Social',
    d: T('谁在公开场合问同类问题。', 'Who is asking about this in public.'),
    caps: T('HN（Algolia 公开 API）→ Reddit（官方 API）', 'HN (Algolia public API) → Reddit (official API)') },
];

let S = null, tab = 'visible';

fetch('/api/project?lang=' + (ZH ? 'zh' : 'en')).then(r => r.json()).then(d => { S = d; render(); })
  .catch(e => { document.getElementById('pProfile').innerHTML = '<div class="empty">' + esc(String(e)) + '</div>'; });

function render() { beat(); profile(); evidence(); today(); ask(); }

function beat() {
  const b = S.brand || {}, n = S.periods.length;
  document.getElementById('bName').textContent = b.name || T('未命名项目', 'Untitled project');
  const pages = (S.latest && S.latest.audit && S.latest.audit.pages) ? S.latest.audit.pages.length : 0;
  document.getElementById('bMeta').textContent = n === 0
    ? T('还没跑过', 'no period yet')
    : T(`第 ${n} 期 · ${S.periods[n - 1]} · ${pages} 页已体检`, `period ${n} · ${S.periods[n - 1]} · ${pages} pages audited`);
  const on = S.engines.filter(e => e.configured).length;
  document.getElementById('bKeys').textContent =
    T(`${S.engines.length} 引擎 · ${on} 已配 Key`, `${S.engines.length} engines · ${on} keyed`);
  const rb = document.getElementById('bReport');
  rb.textContent = T('看完整报告', 'Full report');
  rb.onclick = () => window.open('/api/report?lang=' + (ZH ? 'zh' : 'en'), '_blank');
  const hb = document.getElementById('bHire');
  hb.textContent = T('雇它每天跑 →', 'Run it daily →');
  hb.onclick = () => show(T('每天自动跑', 'Run it daily'), T(
    '在终端跑：\n\n  fastergeo schedule --dir <项目目录> --every 7d\n\n它会装一个定时任务，按期自动跑完整一期：\n采样 → 指标 → 体检 → 工单验收 → 报告。\n\n第 2 期开始，「监测」栏才会出现期对比 ——\n单期只算观察，连续两期同向才叫趋势。',
    'In your terminal:\n\n  fastergeo schedule --dir <project> --every 7d\n\nInstalls a scheduled job that runs a full period:\nsample → metrics → audit → verify → report.\n\nPeriod comparison appears from period 2 onward —\none period is an observation; two consecutive same-direction changes are a trend.'));
  document.getElementById('dlgX').textContent = T('关闭', 'Close');
}

function profile() {
  const b = S.brand || {}, dos = S.dossier || {};
  const facts = (S.facts && S.facts.facts) ? S.facts.facts : [];
  const sourced = facts.filter(f => f.status === 'confirmed').length;
  const comps = b.competitors || [];
  const qs = S.questions || [];
  const voiceFilled = dos['voice.md'] && !/待填|to fill in/.test(dos['voice.md']);
  const docs = [
    ['product.md', T('产品档案', 'Product'), ''],
    ['facts.md', T('品牌事实库', 'Brand facts'), sourced ? `<span class="tag">${T(sourced + ' 条带来源', sourced + ' sourced')}</span>` : ''],
    ['competitors.md', T('竞品分析', 'Competitors'), comps.length ? `<span class="tag warn">${T(comps.length + ' 待核', comps.length + ' to review')}</span>` : ''],
    ['questions.md', T('问题库', 'Questions'), qs.length ? `<span class="tag">${T(qs.length + ' 题', qs.length + ' qs')}</span>` : ''],
    ['voice.md', T('语气指南', 'Voice'), voiceFilled ? '' : `<span class="tag warn">${T('待你填', 'yours to fill')}</span>`],
  ];
  document.getElementById('pProfile').innerHTML = `
    <div class="ph"><b>${T('档案', 'Profile')}</b><span>✎</span></div>
    <div class="brandname">${esc(b.name || '—')}</div>
    <div class="sub">${esc((b.domains || []).join(' · '))}</div>
    <div class="sect">${T('五份档案', 'Five documents')}</div>
    ${docs.map(([f, label, tag]) => dos[f]
      ? `<div class="doc" data-doc="${f}"><span>${label}${tag}</span><span class="e">›</span></div>`
      : `<div class="doc" style="cursor:default"><span style="color:var(--faint)">${label}<span class="tag off">${T('未生成', 'not generated')}</span></span></div>`).join('')}
    ${comps.length ? `<div class="sect">${T('竞品 · 待人工核对', 'Competitors · to review')}</div>
      ${comps.map(c => `<span class="chip">${esc(c.name)}</span>`).join('')}` : ''}
    <div class="rules"><b>${T('我们的纪律', 'Our discipline')}</b><br>
      ${T('· 每个数字都能点开看原话<br>· 打勾是重爬证明的，退步自动打回<br>· 18 引擎，中国 + 海外<br>· <b>算不出就写「未测」，绝不写 0</b>',
      '· Every number traces to a verbatim quote<br>· Done means re-crawled; regressions flip back<br>· 18 engines, China + global<br>· <b>Unmeasured stays unmeasured, never a zero</b>')}
    </div>`;
  document.querySelectorAll('[data-doc]').forEach(el => {
    el.onclick = () => show(el.dataset.doc, S.dossier[el.dataset.doc]);
  });
}

function evidence() {
  const strip = DOMAINS.map(d =>
    `<span class="tab ${d.id === tab ? 'on' : ''} ${d.live ? '' : 'soon'}" data-tab="${d.id}">` +
    `${ZH ? d.zh : d.en}${d.live ? '' : ' · ' + T('未接', 'not wired')}</span>`).join('');
  document.getElementById('pEvidence').innerHTML = `
    <div class="ph"><b>${T('证据', 'Evidence')}</b><span class="mono">${samplesLine()}</span></div>
    <div class="tabs">${strip}</div>
    <div>${tab === 'visible' ? visibleTab() : tab === 'watch' ? watchTab() : soonTab(tab)}</div>`;
  document.querySelectorAll('[data-tab]').forEach(el => {
    el.onclick = () => { tab = el.dataset.tab; evidence(); };
  });
}

function samplesLine() {
  const m = S.latest && S.latest.metrics;
  if (!m) return T('还没采样', 'not sampled yet');
  const eng = new Set(m.platforms.map(p => p.providerId)).size;
  return T(`${eng} 个引擎 · ${m.totalSamples} 个样本`, `${eng} engines · ${m.totalSamples} samples`);
}

function soonTab(id) {
  const d = DOMAINS.find(x => x.id === id);
  return `<div class="soonbox">
      <h3>${ZH ? d.zh : d.en} · ${T('未接', 'not wired yet')}</h3>
      <p>${esc(d.d)}</p>
      <div class="caps"><b>${T('将由这些能力支撑：', 'Backed by:')}</b><br><span class="mono">${esc(d.caps)}</span></div>
    </div>
    <div class="cap" style="margin-top:14px">${T('这一栏还没接上。<b>空着并写清楚，比藏起来假装这个域不存在诚实。</b>',
      'Not wired yet. <b>Saying so beats hiding the tab and pretending the domain does not exist.</b>')}</div>`;
}

function watchTab() {
  const n = S.periods.length;
  if (n >= 2) {
    return `<div class="empty">${T('期对比在完整报告里', 'Period comparison lives in the full report')} —
      <a href="/api/report?lang=${ZH ? 'zh' : 'en'}" target="_blank">${T('打开报告', 'open report')}</a></div>`;
  }
  return `<div class="soonbox">
    <h3>${T('期对比 · 还差一期', 'Period comparison · one more period')}</h3>
    <p>${T(`你现在有 ${n} 期数据。<b>单期变化只算观察，连续两期同向才叫趋势</b> —— 所以第 2 期跑完，这里才会出现真正的对比。`,
      `You have ${n} period(s). <b>A single-period change is an observation; only two consecutive same-direction changes make a trend</b> — real comparison appears after period 2.`)}</p>
    <div class="caps">${T('这不是被锁住的功能。<b>趋势在物理上就需要时间。</b>', 'This is not a locked feature. <b>A trend physically requires time.</b>')}</div>
  </div>`;
}

function visibleTab() {
  const m = S.latest && S.latest.metrics, a = S.latest && S.latest.audit;
  if (!m && !a) {
    return `<div class="empty">${T('还没有数据 —— 先跑一期：<span class="mono">fastergeo cycle --dir &lt;项目&gt;</span>',
      'No data yet — run <span class="mono">fastergeo cycle --dir &lt;project&gt;</span>')}</div>`;
  }
  const quotes = [];
  for (const p of (m ? m.platforms : [])) {
    const who = `${p.providerId} · ${p.market === 'cn' ? T('国内市场', 'China') : T('海外市场', 'Global')}`;
    for (const e of (p.probe && p.probe.confusedEvidence) || []) quotes.push({ kind: 'confused', who, text: e });
    for (const e of (p.sentiment && p.sentiment.negativeEvidence) || []) quotes.push({ kind: 'negative', who, text: e });
  }
  // "Not run" means no data this period — not merely "no key". An engine that
  // produced samples has run, however it was keyed, and counting it as missing
  // would contradict the table directly below.
  const sampled = new Set((m ? m.platforms : []).map(p => p.providerId));
  const unkeyed = S.engines.filter(e => e.driver === 'api' && !e.configured && !sampled.has(e.id));
  const quoteHtml = quotes.length
    ? quotes.slice(0, 4).map(q => `<div class="quote">
        <div class="q">“${esc(q.text.trim())}”</div>
        <div class="qmeta"><span class="qtag ${q.kind === 'negative' ? 'warn' : ''}">${q.kind === 'confused' ? T('认错了', 'mistaken identity') : T('负面', 'negative')}</span>${esc(q.who)}</div>
      </div>`).join('')
    : m ? `<div class="quote calm"><div class="q">${T('本期没有发现认错或负面的原话。', 'No mistaken-identity or negative quotes this period.')}</div>
        <div class="qmeta">${T('全部采样原文在完整报告的「答案回放」里', 'Every sampled answer is in the report’s Answer Replay')}</div></div>` : '';
  const meterHtml = unkeyed.length ? `<div class="meter">
      <span class="n">${unkeyed.length}</span>
      <span class="t"><b>${T(unkeyed.length + ' 个引擎没跑', unkeyed.length + ' engine' + (unkeyed.length > 1 ? 's' : '') + ' not run')}</b> —
        ${T('你还没配它们的 Key，所以<b>没有采样，也就没有原话</b>。', 'no key is configured, so <b>nothing was sampled and no quote exists</b>.')}<br>
        <span style="color:var(--faint)">${T('这里不会放模糊的占位内容：没测过的东西，我们不会假装手里有。',
          'No blurred placeholders here: we do not pretend to hold what we never measured.')}</span></span>
      <button class="btn" style="background:#1C1A15;color:#F3F1EA" id="howKey">${T('怎么配 Key →', 'How to add keys →')}</button>
    </div>` : '';
  return quoteHtml + meterHtml + funnelHtml(m) + engineTable(m);
}

function funnelHtml(m) {
  if (!m) return '';
  const agg = k => {
    const ps = m.platforms.filter(p => p[k] !== null && p[k] !== undefined);
    if (!ps.length) return null;
    const n = ps.reduce((s, p) => s + p.samples, 0);
    return n ? ps.reduce((s, p) => s + p[k] * p.samples, 0) / n : null;
  };
  const rec = m.platforms.reduce((o, p) => {
    const r = (p.probe && p.probe.recognition) || {};
    for (const k of Object.keys(r)) o[k] = (o[k] || 0) + r[k];
    return o;
  }, {});
  const judged = (rec.knows || 0) + (rec.confused || 0) + (rec.unknown || 0) > 0;
  const mention = agg('mentionRate');
  const st = (cls, v, label) => `<div class="st ${cls}"><span class="v">${v}</span>${label}</div>`;
  return `<div class="funnel">
      ${judged ? st(rec.knows > 0 ? 'good' : 'bad', rec.knows > 0 ? '✓' : '✕', T('① 认识你', '① Knows you'))
      : st('na', '—', T('① 认识你', '① Knows you'))}
      ${judged ? st(rec.confused > 0 ? 'bad' : 'good', rec.confused > 0 ? '✕ ' + rec.confused : '✓', T('② 没认错', '② Not confused'))
      : st('na', '—', T('② 没认错', '② Not confused'))}
      ${st(mention ? 'good' : 'bad', mention === null ? '—' : pct(mention), T('③ 想到你', '③ Considered'))}
      ${st('na', mention ? (pct(agg('top3Rate')) || '—') : '—', T('④ 排前面', '④ Top-3'))}
      ${st(agg('ownDomainCiteRate') ? 'good' : 'na', pct(agg('ownDomainCiteRate')) || '—', T('⑤ 引用你', '⑤ Cited'))}
    </div>
    <div class="cap">
      ${!judged ? T('①② 显示「—」是因为没跑认知裁判：加 <b>--judge</b> 才能判定 AI 是否认识你、有没有认错。<br>',
        'Stations ①② read “—” because no recognition judge ran: add <b>--judge</b> to measure them.<br>') : ''}
      ${T('④ 显示「—」不是 0%：提及率为 0 时你根本没进候选集，<b>没有位次可言</b>。',
        '④ reads “—”, not 0%: with no mentions you are not in the candidate set, so <b>no rank exists</b>.')}
    </div>`;
}

function engineTable(m) {
  const byId = new Map(((m && m.platforms) || []).map(p => [p.providerId, p]));
  const rows = S.engines.filter(e => e.driver === 'api').map(e => {
    const mkt = e.market === 'cn' ? T('国内', 'CN') : T('海外', 'Global');
    const p = byId.get(e.id);
    if (!p) {
      return `<tr class="off"><td>${esc(e.name)}</td><td>${mkt}</td><td class="num">—</td><td class="num">—</td>
        <td><span class="nokey">${e.configured ? T('本期未跑', 'not run') : T('未配 Key', 'no key')}</span></td></tr>`;
    }
    const r = (p.probe && p.probe.recognition) || {};
    const conf = r.confused || 0;
    const cog = conf > 0 ? `<span style="color:var(--red)">${T('认错 ×' + conf, 'confused ×' + conf)}</span>`
      : (r.knows || 0) > 0 ? T('认识', 'knows')
        : p.probe ? T('不认识', 'unknown') : NA;
    return `<tr><td>${esc(e.name)}</td><td>${mkt}</td><td class="num">${p.samples}</td>
      <td class="num">${pct(p.mentionRate) || NA}</td><td>${cog}</td></tr>`;
  }).join('');
  return `<table><thead><tr>
      <th>${T('引擎', 'Engine')}</th><th>${T('市场', 'Market')}</th>
      <th style="text-align:right">${T('样本', 'Samples')}</th>
      <th style="text-align:right">${T('提及率', 'Mention')}</th>
      <th>${T('认知', 'Recognition')}</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="cap" style="margin-top:9px">${T('没跑的引擎显示「—」，不是 0。<b>0 是一个测量结果，「—」是没测。</b>',
      'Engines that did not run read “—”, not 0. <b>A zero is a measurement; a dash is its absence.</b>')}</div>`;
}

function today() {
  // Ranking comes from the server, which uses the same rankTickets() the CLI
  // uses. Re-implementing "which three" here would guarantee the workbench and
  // the daily digest eventually disagree about what today's three are.
  const top = S.today || [];
  const c = S.ticketCounts || { done: 0, regressed: 0, all: (S.tickets || []).length };
  const done = c.done, regressed = c.regressed;
  document.getElementById('pToday').innerHTML = `
    <div class="ph"><b>${T('今天', 'Today')}</b><span>${T('修 ' + top.length + ' 件', 'fix ' + top.length)}</span></div>
    ${top.length ? top.map(t => `<div class="card"${t.status === 'regressed' ? ' style="border-color:var(--red)"' : ''}>
        <div class="k"><span class="pr ${esc(t.priority)}">${esc(t.priority)}</span>
          ${t.status === 'regressed' ? `<span class="pr" style="background:var(--red);color:#fff">${T('回归', 'regressed')}</span>` : ''}
          <span class="mono" style="font-size:10.5px;color:var(--faint)">${esc(t.id)}</span></div>
        <div class="t">${esc(t.title)}</div>
        <div class="w">${esc(String(t.rationale || '').slice(0, 150))}</div>
        <div class="acc"><b>${T('修到这样算好：', 'Done when:')}</b> ${esc((t.acceptance && t.acceptance.desc) || '—')}</div>
      </div>`).join('') : `<div class="empty">${T('没有待办 —— 先跑一期', 'Nothing queued — run a period first')}</div>`}
    <div class="state">
      <span class="g">${T('已验收 ' + done, 'verified ' + done)}</span>
      <span class="r">${T('回归 ' + regressed, 'regressed ' + regressed)}</span>
      <span>${T('全部 ' + c.all, 'all ' + c.all)}</span>
    </div>
    <div class="cap">${T('修完跑一次 <span class="mono">fastergeo verify</span>，机器重爬打勾。<b>你说好了不算，重爬说了算。</b>',
      'After fixing, run <span class="mono">fastergeo verify</span>. <b>Done means re-crawled, not asserted.</b>')}</div>`;
}

function ask() {
  const m = S.latest && S.latest.metrics, a = S.latest && S.latest.audit;
  const items = [];
  const conf = ((m && m.platforms) || []).reduce((n, p) => n + ((p.probe && p.probe.recognition && p.probe.recognition.confused) || 0), 0);
  if (conf > 0) {
    items.push(T(`有 <b>${conf} 个回答把你认成了别的公司</b>。这是最贵的一种失败 —— AI 不是不推荐你，是不知道你是谁。`,
      `<b>${conf} answers mistake you for another company.</b> The most expensive failure mode: AI is not declining to recommend you, it does not know who you are.`));
  }
  const shells = ((a && a.pages) || []).filter(p => (p.blockers || []).some(b => /shell|render/i.test(b))).length;
  if (shells > 0) {
    items.push(T(`<b>${shells} 个页面对 AI 是空白</b> —— 内容是 JavaScript 画出来的，爬虫读不到。修好它之前，别的优化都白做。`,
      `<b>${shells} page${shells > 1 ? 's are' : ' is'} blank to an AI crawler</b> — content is drawn by JavaScript. Nothing else moves until this is fixed.`));
  }
  if (a && a.entity && !a.entity.organizationSchema) {
    items.push(T('你的<b>实体声明是空的</b>（没有 Organization JSON-LD）。如果上面出现了认错，这两件很可能是同一件事。',
      'Your <b>entity declaration is empty</b> (no Organization JSON-LD). If there is confusion above, these are probably the same problem.'));
  }
  if (!items.length) {
    items.push(m ? T('本期没有发现致命问题。完整体检在报告里。', 'No blockers this period. The full audit is in the report.')
      : T('还没跑过。终端里跑 <span class="mono">fastergeo start &lt;你的网址&gt;</span>。', 'Nothing run yet. Try <span class="mono">fastergeo start &lt;your site&gt;</span>.'));
  }
  const n = S.periods.length;
  document.getElementById('pAsk').innerHTML = `
    <div class="ph"><b>${T('问它', 'Ask')}</b><span class="mono">${T('未接', 'not wired')}</span></div>
    <div class="sect">${T('今日简报', 'Today’s brief')}</div>
    <ul class="brief">
      ${items.map(i => `<li>${i}</li>`).join('')}
      ${n < 2 ? `<li class="note">${T(`第 ${n} 期没有期对比。<b>单期只算观察，连续两期同向才叫趋势</b> —— 下一期才会出现这一栏。`,
        `Period ${n} has no comparison. <b>One period is an observation; two consecutive same-direction changes are a trend</b> — it appears next period.`)}</li>` : ''}
    </ul>
    ${S.contract ? `<div class="sect">${T('每天你会拿到什么', 'What you get every day')}</div>
      <div style="background:var(--well);border-radius:7px;padding:11px 12px;font-size:11.5px;
        line-height:1.75;color:var(--dim);white-space:pre-wrap">${esc(S.contract)}</div>
      ${S.digest ? `<div class="cap" style="margin-top:8px">${T('最近一次的摘要在 <span class="mono">today.md</span> 里，', 'The latest digest is in <span class="mono">today.md</span>, ')}<a href="#" id="seeDigest">${T('点这里看', 'read it here')}</a>。</div>` : ''}` : ''}
    <div class="ask"><b>${T('对话入口还没接', 'Chat is not wired yet')}</b>
      ${T('MCP 的 9 个工具已经在跑，<br>界面还没做。', 'The 9 MCP tools already run.<br>The interface does not exist yet.')}<br>
      <span class="note">${T('占位标清楚，比假装能用强。', 'A labelled placeholder beats a fake feature.')}</span></div>`;
  const sd = document.getElementById('seeDigest');
  if (sd) sd.onclick = e => { e.preventDefault(); show('today.md', S.digest); };
}

function show(title, body) {
  document.getElementById('dlgT').textContent = title;
  document.getElementById('dlgB').textContent = body || '';
  document.getElementById('dlg').showModal();
}
document.getElementById('dlgX').onclick = () => document.getElementById('dlg').close();
document.addEventListener('click', e => {
  if (e.target && e.target.id === 'howKey') {
    show(T('配置引擎 Key', 'Configure engine keys'), T(
      '每个引擎读一个环境变量。Key 只在你本机，永不上传。\n\n  export ARK_API_KEY=…        # 豆包\n  export DEEPSEEK_API_KEY=…   # DeepSeek\n  export ZHIPUAI_API_KEY=…    # 智谱 GLM\n  export OPENAI_API_KEY=…     # ChatGPT\n\n配好后跑 fastergeo check 看健康状态，再跑一期。\n\n一个 Key 都不想配？跑 fastergeo sheet：\n把问题贴进 AI 网页版，把回答贴回来，指标照样算。',
      'Each engine reads one environment variable. Keys stay on your machine and are never uploaded.\n\n  export ARK_API_KEY=…\n  export DEEPSEEK_API_KEY=…\n  export ZHIPUAI_API_KEY=…\n  export OPENAI_API_KEY=…\n\nThen run fastergeo check, then a cycle.\n\nNo keys at all? Run fastergeo sheet: paste the questions into any AI web app by hand, paste the answers back, and the metrics still compute.'));
  }
});
</script></body></html>
