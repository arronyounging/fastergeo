name = "fastergeo-cron"
main = "index.js"
compatibility_date = "2026-01-01"

# Hourly, though each site is checked once a day: a run handles only a few sites
# to stay inside the Worker's budget, and skips those already checked. Starts at
# 03:00 UTC in effect, since most sites were last checked around then.
[triggers]
crons = ["0 * * * *"]

[vars]
SWEEP_URL = "https://fastergeo.co/api/sweep"
# SWEEP_TOKEN is a secret: wrangler secret put SWEEP_TOKEN
